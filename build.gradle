import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.139'
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream {
        stream -> secrets.load(stream)
    }

    fileTree("secrets").matching {
        include "**/*.properties"
    }.each {
        File file ->
            file.withInputStream {
                stream -> secrets.load(stream)
            }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

version = "${project.minecraft_version}-${project.mod_version}"
group = 'com.memedream.classicmobs'
base {
    archivesName = "${project.modid}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-this-escape" << "-Werror"
    options.encoding = 'UTF-8'
}

sourceSets {
    data {
        compileClasspath += main.compileClasspath + main.output

        java {
            srcDirs = ['src/main/java', 'src/data/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

configurations {
    dataImplementation.extendsFrom implementation
}

neoForge {
    // we need the subprojects to evaluate first so that the sourceSets are properly constructed
    evaluationDependsOnChildren()

    version = "${project.neo_version}"
    validateAccessTransformers = true

    addModdingDependenciesTo sourceSets.data


    mods {
        "${project.modid}" {
            it.sourceSet this.sourceSets.main
        }

        "${project.modid}-data" {
            it.sourceSet this.sourceSets.main
            it.sourceSet this.sourceSets.data
        }
    }

    def mainMod = mods."${project.modid}"
    def dataMod = mods."${project.modid}-data"

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            loadedMods = [mainMod]
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', modid
            programArguments.addAll '--username', secrets.getProperty("username") ?: 'Dev', secrets.getProperty("uuid") ? '--uuid' : '', secrets.getProperty("uuid") ?: ''
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', modid
            programArgument '--nogui'
        }

        data {
            clientData()
            programArguments.addAll '--mod', modid, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            sourceSet = this.sourceSets.data
            loadedMods = [dataMod]
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name 'Jared\'s Maven' // JEI
        url 'https://maven.blamejared.com/'
    }
    maven {
        name 'Shedaniel\'s Maven' //REI
        url "https://maven.shedaniel.me"
    }
    maven {
        name "TerraformersMC" //EMI
        url "https://maven.terraformersmc.com/"
    }
    maven {
        name 'Curseforge Maven' // Jade
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    //make sure to only pick one of these when testing (switch others to compileOnly)
//  implementation "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
//	compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"
//	implementation "dev.emi:emi-neoforge:${project.emi_version}+${project.minecraft_version}"

//  runtimeOnly "curse.maven:just-enough-resources-jer-240630:6174588"
//	runtimeOnly "curse.maven:jade-324717:6853386"
}

processResources {
    def ver = project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand([
                'file': [
                        'jarVersion': ver
                ]
        ])
    }
    exclude ".cache"
    def lazyTree = providers.provider {
        fileTree(dir: getOutputs().getFiles().getAsPath(), includes: ["**/*.json", "**/*.mcmeta"])
    }
    doLast {
        lazyTree.get().each {
            File file -> file.setText(JsonOutput.toJson(new JsonSlurper().parse(file)))
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "${project.modid}",
                "Specification-Vendor"    : "Meme Dream",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Meme Dream",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}